name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - offline-first

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout offline-first
        uses: actions/checkout@v4
        with:
          ref: offline-first

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build universal FOSS debug APK
        run: ./gradlew :app:assembleUniversalFossDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-offline-first-debug
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
